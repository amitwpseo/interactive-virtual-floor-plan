<script>
document.addEventListener("DOMContentLoaded", () => {
  const viewport = document.getElementById('vfp-viewport');
  const panWrapper = document.getElementById('vfp-pan-wrapper');
  const items = document.querySelectorAll('.vfp-item');
  const drawer = document.getElementById('vfp-drawer');
  const drawerClose = document.getElementById('vfp-drawer-close');
  const searchInput = document.getElementById('vfp-search-input');
  const filterPills = document.querySelectorAll('.vfp-pill');

  const BASE_WIDTH = 1660;
  const BASE_HEIGHT = 960;

  let scale = 1, translateX = 0, translateY = 0;
  let isDragging = false, startX = 0, startY = 0, hasMoved = false;

  const applyTransform = () => {
    panWrapper.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
    panWrapper.style.transition = isDragging ? 'none' : 'transform 0.15s ease-out';
  };

  const resetView = () => {
    if (!viewport) return;
    const vRect = viewport.getBoundingClientRect();
    scale = Math.min(vRect.width / BASE_WIDTH, vRect.height / BASE_HEIGHT) * 0.96;
    translateX = (vRect.width - (BASE_WIDTH * scale)) / 2;
    translateY = (vRect.height - (BASE_HEIGHT * scale)) / 2;
    applyTransform();
  };

  resetView();
  window.addEventListener('resize', resetView);
  window.addEventListener('orientationchange', () => setTimeout(resetView, 250));

  viewport.addEventListener('mousedown', (e) => {
    if (e.target.closest('#vfp-drawer') || e.target.closest('.vfp-hud-controls')) return;
    isDragging = true; hasMoved = false;
    startX = e.clientX - translateX; startY = e.clientY - translateY;
  });
  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    hasMoved = true;
    translateX = e.clientX - startX; translateY = e.clientY - startY;
    applyTransform();
  });
  window.addEventListener('mouseup', () => { isDragging = false; });
  viewport.addEventListener('mouseleave', () => { isDragging = false; });

  viewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = e.deltaY < 0 ? 0.15 : -0.15;
    const rect = viewport.getBoundingClientRect();
    const mouseX = e.clientX - rect.left, mouseY = e.clientY - rect.top;
    const newScale = Math.min(Math.max(0.25, scale + delta), 4.0);
    translateX -= (mouseX - translateX) * (newScale / scale - 1);
    translateY -= (mouseY - translateY) * (newScale / scale - 1);
    scale = newScale; applyTransform();
  }, { passive: false });

  let initialTouchDist = 0, initialScale = 1;
  viewport.addEventListener('touchstart', (e) => {
    if (e.target.closest('#vfp-drawer') || e.target.closest('.vfp-hud-controls')) return;
    if (e.touches.length === 1) {
      isDragging = true; hasMoved = false;
      startX = e.touches[0].clientX - translateX; startY = e.touches[0].clientY - translateY;
    } else if (e.touches.length === 2) {
      isDragging = false; initialScale = scale;
      initialTouchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    }
  }, { passive: true });

  viewport.addEventListener('touchmove', (e) => {
    if (e.touches.length === 1 && isDragging) {
      hasMoved = true;
      translateX = e.touches[0].clientX - startX; translateY = e.touches[0].clientY - startY;
      applyTransform();
    } else if (e.touches.length === 2 && initialTouchDist > 0) {
      const currentDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      const rect = viewport.getBoundingClientRect();
      const midX = ((e.touches[0].clientX + e.touches[1].clientX) / 2) - rect.left;
      const midY = ((e.touches[0].clientY + e.touches[1].clientY) / 2) - rect.top;
      const targetScale = Math.min(Math.max(0.25, initialScale * (currentDist / initialTouchDist)), 4.0);
      translateX -= (midX - translateX) * (targetScale / scale - 1);
      translateY -= (midY - translateY) * (targetScale / scale - 1);
      scale = targetScale; applyTransform();
    }
  }, { passive: true });

  viewport.addEventListener('touchend', () => { isDragging = false; initialTouchDist = 0; });

  const zoomBy = (amount) => {
    const vRect = viewport.getBoundingClientRect();
    const cx = vRect.width / 2, cy = vRect.height / 2;
    const newScale = Math.min(Math.max(0.25, scale + amount), 4.0);
    translateX -= (cx - translateX) * (newScale / scale - 1);
    translateY -= (cy - translateY) * (newScale / scale - 1);
    scale = newScale; applyTransform();
  };
  document.getElementById('vfp-btn-in')?.addEventListener('click', () => zoomBy(0.3));
  document.getElementById('vfp-btn-out')?.addEventListener('click', () => zoomBy(-0.3));
  document.getElementById('vfp-btn-reset')?.addEventListener('click', resetView);

  const selectItem = (el) => {
    items.forEach(i => i.classList.remove('selected'));
    el.classList.add('selected');

    const isAvail = el.classList.contains('booth-avail');
    const name = el.getAttribute('data-name') || 'Open Booth Space';
    const id = el.getAttribute('data-id') || '—';
    const type = el.getAttribute('data-type') || 'Zone';
    const status = el.getAttribute('data-status') || (isAvail ? 'Available' : 'Reserved');
    const desc = el.getAttribute('data-desc') ||
      (isAvail
        ? 'This space is currently open for the 2027 show. Contact the exhibitor team to reserve it.'
        : `${name} — ${type}. This space is confirmed for the event.`);

    document.getElementById('vfp-d-name').textContent = name;
    document.getElementById('vfp-d-id').textContent = id;
    document.getElementById('vfp-d-type').textContent = type;
    document.getElementById('vfp-d-desc').textContent = desc;

    const statusEl = document.getElementById('vfp-d-status');
    statusEl.innerHTML = (status === 'Reserved')
      ? `<i class="fa-solid fa-circle-check text-orange"></i> Reserved`
      : `<i class="fa-solid fa-circle-check" style="color:#fff"></i> Open`;

    drawer.classList.add('active');
  };

  items.forEach(item => {
    item.addEventListener('click', (e) => {
      if (hasMoved) return;
      e.stopPropagation();
      selectItem(item);
    });
  });

  drawerClose?.addEventListener('click', () => {
    drawer.classList.remove('active');
    items.forEach(i => i.classList.remove('selected'));
  });

  filterPills.forEach(pill => {
    pill.addEventListener('click', () => {
      filterPills.forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      const filter = pill.getAttribute('data-filter');
      items.forEach(item => {
        const type = (item.getAttribute('data-type') || '').toLowerCase();
        const isAvail = item.classList.contains('booth-avail');
        let match = false;
        if (filter === 'all') match = true;
        else if (filter === 'stage' && (type.includes('stage') || type.includes('attraction') || type.includes('track') || type.includes('store') || type.includes('exhibit') || type.includes('media') || type.includes('display'))) match = true;
        else if (filter === 'vip' && type.includes('vip')) match = true;
        else if (filter === 'booth-booked' && !isAvail && (type.includes('booth') || type.includes('anchor') || type.includes('mini'))) match = true;
        else if (filter === 'booth-avail' && isAvail) match = true;
        item.classList.toggle('dimmed', !match);
      });
    });
  });

  searchInput?.addEventListener('input', (e) => {
    const query = e.target.value.toLowerCase().trim();
    items.forEach(item => {
      const name = (item.getAttribute('data-name') || '').toLowerCase();
      const id = (item.getAttribute('data-id') || '').toLowerCase();
      const type = (item.getAttribute('data-type') || '').toLowerCase();
      const match = name.includes(query) || id.includes(query) || type.includes(query);
      item.classList.toggle('dimmed', !match && query !== '');
    });
  });

  const lightbox = document.getElementById('floorplan-lightbox');
  document.getElementById('vfp-open-blueprint-modal')?.addEventListener('click', () => {
    lightbox.classList.add('active');
    document.body.style.overflow = 'hidden';
  });
  lightbox?.querySelector('.lightbox-close')?.addEventListener('click', () => {
    lightbox.classList.remove('active');
    document.body.style.overflow = 'auto';
  });
  lightbox?.addEventListener('click', (e) => {
    if (e.target === lightbox) { lightbox.classList.remove('active'); document.body.style.overflow = 'auto'; }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === "Escape" && lightbox?.classList.contains('active')) {
      lightbox.classList.remove('active'); document.body.style.overflow = 'auto';
    }
  });
});
</script>
